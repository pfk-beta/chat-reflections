<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chat reflections{% endblock %}</title>
<link rel="stylesheet" data-hljs="light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" data-hljs="dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script>
// theme mode: "auto" (follow OS) | "light" | "dark"; resolved into data-theme before first paint
const THEMES = ["auto", "light", "dark"];
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
function getMode() {
  try { return localStorage.getItem("theme") || "auto"; } catch { return "auto"; }
}
function applyTheme(mode) {
  const dark = mode === "dark" || (mode === "auto" && darkQuery.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelectorAll("link[data-hljs]").forEach((l) => { l.disabled = (l.dataset.hljs === "dark") !== dark; });
  const btn = document.getElementById("theme-toggle");
  if (btn) {
    btn.textContent = { auto: "🌓", light: "☀️", dark: "🌙" }[mode];
    btn.title = `Theme: ${mode} (click to change)`;
  }
}
applyTheme(getMode());
darkQuery.addEventListener("change", () => applyTheme(getMode()));
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #fff; --fg: #111827; --muted: #6b7280; --faint: #9ca3af; --text2: #374151;
    --border: #e5e7eb; --border-strong: #d1d5db; --surface: #f3f4f6; --surface2: #f8fafc; --part-bg: #fff;
    --link: #2563eb; --btn: #2563eb; --btn-fg: #fff; --btn2: #eff6ff; --btn2-fg: #1d4ed8;
    --active: #dbeafe; --user: #eff6ff; --assistant: #f9fafb;
    --mark: #fde68a; --mark-fg: #111827; --error: #b91c1c; --target: #f59e0b;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --fg: #e5e7eb; --muted: #9ca3af; --faint: #6b7280; --text2: #d1d5db;
    --border: #2a2f3a; --border-strong: #3a4150; --surface: #1c212b; --surface2: #161a22; --part-bg: #12151b;
    --link: #60a5fa; --btn: #3b82f6; --btn-fg: #fff; --btn2: #1e293b; --btn2-fg: #93c5fd;
    --active: #1e3a5f; --user: #172033; --assistant: #151922;
    --mark: #854d0e; --mark-fg: #fef3c7; --error: #f87171; --target: #f59e0b;
  }

  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem; line-height: 1.5; background: var(--bg); color: var(--fg); }
  body.wide { max-width: none; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1rem; }
  header h1 { margin: 0; font-size: 1.4rem; }
  #theme-toggle { margin-left: auto; align-self: center; background: none; border: 1px solid var(--border); border-radius: 6px; padding: .15rem .45rem; cursor: pointer; font-size: 1rem; }
  a { color: var(--link); text-decoration: none; }
  form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  input[type=search] { flex: 1; padding: .5rem; font-size: 1rem; }
  .meta { color: var(--muted); font-size: .85rem; }
  .src { display: inline-block; padding: 0 .4rem; border-radius: 4px; background: var(--surface); font-size: .8rem; }
  .item { padding: .75rem 0; border-bottom: 1px solid var(--border); }
  .pager { display: flex; gap: 1rem; justify-content: center; align-items: center; margin: 1rem 0; }
  mark { background: var(--mark); color: var(--mark-fg); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  .card h2 { margin: 0; }
  .card .actions { display: flex; flex-direction: column; gap: .5rem; margin-top: 1rem; }
  .btn { display: block; padding: .9rem 1rem; border-radius: 8px; background: var(--btn); color: var(--btn-fg); font-weight: 600; text-align: center; }
  .btn.secondary { background: var(--btn2); color: var(--btn2-fg); }
  .btn:hover { filter: brightness(1.08); }

  .browse { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; gap: 1.5rem; }
  .browse > * { overflow-y: auto; min-height: 0; }
  .list .item { display: block; padding: .5rem .6rem; border-radius: 6px; border-bottom: none; color: inherit; }
  .list .item:hover { background: var(--surface); }
  .list .item.active { background: var(--active); }
  .list .item .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .content h2 { margin-top: 0; }
  .list form { position: sticky; top: 0; background: var(--bg); padding-bottom: .5rem; margin-bottom: .5rem; }
  .list .snip { font-size: .85rem; color: var(--text2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .msg:target { outline: 2px solid var(--target); }
  @media (max-width: 800px) {
    body.wide { height: auto; }
    .browse { grid-template-columns: 1fr; }
  }

  .msg { padding: .75rem 1rem; margin: .75rem 0; border-radius: 8px; overflow-wrap: anywhere; }
  .msg > .head + * { margin-top: 0; }
  .msg pre { background: var(--surface); padding: .75rem; border-radius: 6px; overflow-x: auto; }
  .msg pre code.hljs { padding: 0; background: none; }
  .msg code { font-size: .9em; }
  .msg .math.display { display: block; overflow-x: auto; }
  .msg table { border-collapse: collapse; display: block; overflow-x: auto; }
  .msg th, .msg td { border: 1px solid var(--border-strong); padding: .25rem .5rem; }
  .msg a.image { display: inline-block; margin: .25rem .5rem .25rem 0; }
  .msg a.image img { max-width: min(100%, 420px); max-height: 420px; border-radius: 6px; border: 1px solid var(--border); }
  .user { background: var(--user); }
  .assistant { background: var(--assistant); }

  .head { display: flex; justify-content: space-between; gap: 1rem; }
  details.json { margin: .25rem 0 .75rem; }
  details.json summary { cursor: pointer; color: var(--muted); font-size: .8rem; }
  details.json pre { max-height: 60vh; overflow: auto; background: var(--surface2); border: 1px solid var(--border); padding: .75rem; border-radius: 6px; font-size: .8rem; }

  details.part { margin: .35rem 0; border: 1px solid var(--border); border-radius: 6px; background: var(--part-bg); }
  details.part summary { cursor: pointer; padding: .3rem .6rem; font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details.part .hint { color: var(--faint); font-family: ui-monospace, monospace; font-size: .8rem; }
  details.part .body { padding: 0 .6rem .5rem; }
  details.part pre { max-height: 50vh; overflow: auto; font-size: .8rem; }
  details.part.error summary { color: var(--error); }
  .list form { flex-wrap: wrap; }
  .list select { width: 100%; padding: .3rem; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  applyTheme(getMode());
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const next = THEMES[(THEMES.indexOf(getMode()) + 1) % THEMES.length];
    try { localStorage.setItem("theme", next); } catch {}
    applyTheme(next);
  });
  hljs.highlightAll();
  document.querySelectorAll(".msg .math").forEach((el) =>
    katex.render(el.textContent, el, { displayMode: el.classList.contains("display"), throwOnError: false }));
  document.querySelector(".list .active")?.scrollIntoView({ block: "center" });
  document.querySelectorAll("details.json").forEach((d) => d.addEventListener("toggle", async () => {
    const code = d.querySelector("code");
    if (!d.open || code.dataset.loaded) return;
    const resp = await fetch(d.dataset.url);
    code.textContent = JSON.stringify(await resp.json(), null, 2);
    code.dataset.loaded = "1";
    hljs.highlightElement(code);
  }));
});
</script>
</head>
<body class="{% block body_class %}{% endblock %}">
<header>
  <h1><a href="/">Chat reflections</a></h1>
  {% block nav %}{% endblock %}
  <button id="theme-toggle" type="button" aria-label="Toggle theme">🌓</button>
</header>
{% block content %}{% endblock %}
</body>
</html>
