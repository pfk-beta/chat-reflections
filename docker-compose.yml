services:
  es:
    build:
      context: docker
      dockerfile: Dockerfile.es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health"]
      interval: 5s
      retries: 30

  app:
    build: .
    environment:
      - ES_URL=http://es:9200
      - CHAT_LANGUAGES=${CHAT_LANGUAGES:-english}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      es:
        condition: service_healthy

volumes:
  esdata:
